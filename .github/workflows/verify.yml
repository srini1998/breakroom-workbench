name: Verify Breakroom
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase
        run: npx supabase start --exclude studio,analytics,vector,meta,edge-runtime,imgproxy,inbucket > /tmp/breakroom-services.log 2>&1
      - run: npm run env:supabase
      - run: npm run setup:supabase
      - run: npm run setup:isolation
      - run: npm run setup:switchboard
      - run: npm run build
      - run: npm test
      - run: npm run verify:auth
      - run: npm run verify:isolation
      - run: npm run verify:restart
      - run: npm run verify:erasure
      - run: npm run verify:import
      - run: npm run smoke:switchboard
      - name: Stop local services
        if: always()
        run: npx supabase stop
# Live-model evaluations and macOS Chrome smoke are run locally and recorded in docs/evidence.
# This workflow is prepared but no GitHub-hosted execution is claimed before publication.
